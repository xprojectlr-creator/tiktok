<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Preserver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>TikTok Preserver</h1>
  <div id="drop" style="padding:8px;">
    <label for="fileInput" id="pickLabel"
           style="display:flex; align-items:center; justify-content:center;
                  min-height:120px; cursor:pointer; border:2px dashed #888;
                  border-radius:8px; padding:16px; text-align:center;">
      Tap untuk pilih video, atau drag ke sini
    </label>
    <input id="fileInput" type="file" accept="video/*"
           style="display:none">
    <p id="fileName">Belum ada file.</p>
    <p id="fileSize"></p>
  </div>
  <div class="row">
    <button id="prosesBtn" style="display:none; min-height:48px; flex:1; font-size:1.05rem;">Proses Sekarang</button>
  </div>
  <div id="manualLinks" class="row" style="display:none; flex-wrap:wrap;">
    <a id="manualDownload" class="dl" download="video.mp4" style="min-height:44px; display:inline-flex; align-items:center;">Klik di sini untuk unduh</a>
    <a id="openTab" class="dl" target="_blank" rel="noopener" style="min-height:44px; display:inline-flex; align-items:center;">Buka di tab baru</a>
  </div>
  <textarea id="log" readonly rows="12"></textarea>
  <div id="result"></div>
  <div id="hasilWrap" style="display:none; margin-top:16px;">
    <p><strong>Hasil siap:</strong> <span id="hasilInfo"></span></p>
    <button id="simpanBtn"
            style="min-height:48px; padding:12px 20px; font-size:16px;
                   background:#fe2c55; color:#fff; border:0; border-radius:8px;
                   cursor:pointer; width:100%;">
      Simpan / Bagikan Video
    </button>
    <p style="font-size:13px;color:#666;margin-top:8px;">
      Di Android, tombol ini membuka menu Share — pilih "Files" atau
      "Simpan ke Perangkat" untuk menyimpan video.
    </p>
  </div>
</main>
<script src="mp4-patch.js"></script>
<script src="app.js"></script>
</body>
</html>
